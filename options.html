<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Options - Freelancer Kit</title>
  <style>
    /* basic options styles from before + defaultTemplate select */
    :root { --primary: #108a00; --primary-hover: #14a800; --text-main: #222222; --border: #e0e0e0; --bg-color: #f9f9f9; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-main); max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    .container { background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); }
    h1 { color: var(--primary); margin-bottom: 20px; font-size: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="text"], select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 14px; box-sizing: border-box; }
    .help-text { font-size: 12px; color: #666; margin-top: 4px; }
    button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: var(--primary-hover); }
    #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    #status.success { display: block; background-color: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Smart Settings</h1>
    
    <div class="form-group">
      <label for="freelancerName">Your Name</label>
      <input type="text" id="freelancerName" placeholder="e.g. John Doe">
    </div>
    
    <div class="form-group">
      <label for="skills">Your Skills</label>
      <input type="text" id="skills" placeholder="e.g. JavaScript, React, Web Scraping">
      <div class="help-text">Comma-separated list of your core skills. Used in smart proposals.</div>
    </div>
    
    <div class="form-group">
      <label for="defaultTemplate">Default Proposal Template</label>
      <select id="defaultTemplate">
        <option value="detailed">Detailed Structure (Default)</option>
        <option value="short">Short & Punchy</option>
        <option value="technical">Technical Breakdown</option>
      </select>
    </div>
    
    <button id="saveBtn">Save Settings</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
